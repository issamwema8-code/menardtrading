<table style="border-collapse: collapse; margin-bottom: 6px;">
  <tr>
    <td style="vertical-align: middle; padding-right: 12px; width: 78px;">
      {% if branding.emblem_base64 %}
      <img src="{{ branding.emblem_base64 }}" width="68" height="42" alt="Menard Trading CC" style="display: block;" />
      {% elif branding.logo_url %}
      <img src="{{ branding.logo_url }}" width="68" height="42" alt="Menard Trading CC" style="display: block;" />
      {% endif %}
    </td>
    <td style="vertical-align: middle; width: 170px; white-space: nowrap;">
      <div class="brand-title" style="white-space: nowrap; overflow: visible;">{{ branding.brand_name|default:branding.company_name|default:"MENARD TRADING CC" }}</div>
      <table style="width: 100%; border-collapse: collapse; margin-top: 3px;">
        <tr>
          <td style="text-align: left; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">A</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">L</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">W</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">A</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">Y</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">S</td>
          <td style="width: 6px;"></td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">O</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">N</td>
          <td style="width: 6px;"></td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">T</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">I</td>
          <td style="text-align: center; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">M</td>
          <td style="text-align: right; font-size: 5.5pt; font-weight: bold; color: #b47828; text-transform: uppercase; padding: 0; line-height: 1;">E</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
